<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Rocket Engineers</title>
    <meta name="description" content="Find vetted cloud, DevOps, and platform engineering providers across Switzerland, Germany, and the wider DACH region." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/listing-swiss.css" />
  </head>
  <body class="swissListingPage">
    <header class="appHeader">
      <div class="brandCluster">
        <div class="cloudLogo">Rocket<span class="logoAsterisk">*</span>Engineers</div>
      </div>
      <nav class="topNav" aria-label="Primary navigation">
        <a href="#" data-nav-tab="home">Home</a>
        <a href="#" class="active" data-nav-tab="providers">Providers</a>
        <a href="#" data-nav-tab="stories" hidden>Success Stories</a>
        <a href="#" data-nav-tab="events" hidden>Events</a>
        <a href="#" data-nav-tab="signals" hidden>Signals <span class="navBadge">Pro</span></a>
      </nav>
      <div class="headerActions">
        <span id="status" hidden>Loading profiles</span>
      </div>
    </header>

    <section class="searchHero">
      <div>
        <h1>Find your next transformation partner</h1>
        <p>Find cloud, DevOps, platform, and software providers using generated profile evidence.</p>
      </div>
      <div class="heroSearchColumn">
        <label class="heroSearch">
          <span>Search Rocket Engineers</span>
          <input id="searchInput" type="search" placeholder="Search providers, services, technologies, partnerships" />
        </label>
        <div class="heroQuickFilters">
          <div class="heroFilterDropdown">
            <button type="button" class="heroQuickFilter" data-filter-toggle="country" aria-expanded="false" aria-controls="countryFilterPanel">Country <span aria-hidden="true">⌄</span></button>
            <div id="countryFilterPanel" class="heroFilterPanel" hidden>
              <div class="heroFilterPanelHead">
                <input type="search" class="filterOptionSearch" placeholder="Search countries" data-filter-search="country" />
                <button type="button" data-clear-filter="country">Clear</button>
              </div>
              <div id="countryFilter" class="filterOptionList" data-filter-key="country"></div>
            </div>
          </div>
          <div class="heroFilterDropdown">
            <button type="button" class="heroQuickFilter" data-filter-toggle="service" aria-expanded="false" aria-controls="serviceFilterPanel">Service <span aria-hidden="true">⌄</span></button>
            <div id="serviceFilterPanel" class="heroFilterPanel" hidden>
              <div class="heroFilterPanelHead">
                <input type="search" class="filterOptionSearch" placeholder="Search services" data-filter-search="service" />
                <button type="button" data-clear-filter="service">Clear</button>
              </div>
              <div id="serviceFilter" class="filterOptionList" data-filter-key="service"></div>
            </div>
          </div>
          <div class="heroFilterDropdown">
            <button type="button" class="heroQuickFilter" data-filter-toggle="technology" aria-expanded="false" aria-controls="technologyFilterPanel">Technology <span aria-hidden="true">⌄</span></button>
            <div id="technologyFilterPanel" class="heroFilterPanel" hidden>
              <div class="heroFilterPanelHead">
                <input type="search" class="filterOptionSearch" placeholder="Search technologies" data-filter-search="technology" />
                <button type="button" data-clear-filter="technology">Clear</button>
              </div>
              <div id="technologyFilter" class="filterOptionList" data-filter-key="technology"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <nav id="focusStrip" class="focusStrip" aria-label="Quick search by focus area" hidden></nav>

    <section id="homePage" class="homePage" hidden></section>
    <section id="storiesPage" class="staticPage" hidden></section>
    <section id="eventsPage" class="staticPage" hidden></section>
    <section id="signalsPage" class="staticPage" hidden></section>

    <main id="providersPage" class="marketplace">
      <section class="listingArea" aria-label="Company profiles">
        <section class="detail" aria-label="Profile detail" hidden>
          <div id="detailContent" class="detailContent empty">
            Select a provider card to view profile details.
          </div>
        </section>

        <div class="activeFiltersBar">
          <div id="activeFilters" class="activeFilters" hidden></div>
          <button id="resetButton" class="resetFiltersLink" type="button">Reset filters</button>
        </div>
        <div id="profileList" class="profileList">
          <div class="loadingSpinner" role="status" aria-label="Loading providers">
            <span class="loadingSpinnerRing"></span>
            <span>Loading providers…</span>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
